<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --col-pin-w: 64px;
      --col-nama-w: 130px;
      --col-stat-w: 34px;
      --col-pct-w: 42px;
      --col-sesi-w: 42px;
      --cell-h: 34px;
      --cell-font: 10.5px;
      --cell-badge-w: 24px;
      --cell-badge-h: 20px;
    }

    @media (max-width: 640px) {
      :root {
        --col-pin-w: 58px;
        --col-nama-w: 122px;
        --col-stat-w: 34px;
        --col-pct-w: 42px;
        --col-sesi-w: 42px;
        --cell-h: 34px;
        --cell-font: 10.5px;
        --cell-badge-w: 24px;
        --cell-badge-h: 20px;
      }
    }

    .touch-target {
      min-height: 40px;
      min-width: 40px;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
    }

    /* STANDAR MUTLAK SPREADSHEET SESUAI WEB UTAMA */
    table.app-table {
      border-collapse: separate !important;
      border-spacing: 0 !important;
      width: max-content !important;
      min-width: 100% !important;
      font-size: var(--cell-font);
      border: 1px solid #cbd5e1 !important;
      background-color: #ffffff;
      table-layout: auto !important;
    }
    table.app-table th, table.app-table td {
      border-right: 1px solid #cbd5e1 !important;
      border-bottom: 1px solid #cbd5e1 !important;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
      box-sizing: border-box;
    }
    table.app-table th {
      font-size: calc(var(--cell-font) - 1px);
      font-weight: 700;
      padding: 6px 4px;
    }
    table.app-table td {
      font-size: var(--cell-font);
      height: var(--cell-h);
      padding: 3px 2px;
    }
    table.app-table .col-pin {
      width: var(--col-pin-w) !important;
      min-width: var(--col-pin-w) !important;
      max-width: var(--col-pin-w) !important;
      box-sizing: border-box;
    }
    table.app-table .col-nama {
      width: var(--col-nama-w) !important;
      min-width: var(--col-nama-w) !important;
      max-width: var(--col-nama-w) !important;
      text-align: left !important;
      padding-left: 8px !important;
      padding-right: 8px !important;
      box-sizing: border-box;
    }
    table.app-table .col-stat {
      width: var(--col-stat-w) !important;
      min-width: var(--col-stat-w) !important;
      max-width: var(--col-stat-w) !important;
      box-sizing: border-box;
      padding: 3px 2px !important;
    }
    table.app-table .col-pct {
      width: var(--col-pct-w) !important;
      min-width: var(--col-pct-w) !important;
      max-width: var(--col-pct-w) !important;
      box-sizing: border-box;
      padding: 3px 2px !important;
    }
    table.app-table .col-sesi {
      width: var(--col-sesi-w) !important;
      min-width: var(--col-sesi-w) !important;
      padding: 2px !important;
      box-sizing: border-box;
    }
    table.app-table .border-r-thick {
      border-right: 2px solid #64748b !important;
    }

    /* STICKY COLUMNS PIN & NAMA */
    .sticky-col-pin {
      position: sticky !important;
      left: 0 !important;
      z-index: 25 !important;
      width: var(--col-pin-w) !important;
      min-width: var(--col-pin-w) !important;
      max-width: var(--col-pin-w) !important;
      box-shadow: 2px 0 5px -2px rgba(0, 0, 0, 0.1);
      background-color: #ffffff !important;
    }
    tbody tr:nth-child(even) .sticky-col-pin {
      background-color: #f8fafc !important;
    }
    tbody tr:nth-child(odd) .sticky-col-pin {
      background-color: #ffffff !important;
    }
    #tableAsrama thead .sticky-col-pin {
      background-color: #d1fae5 !important;
      color: #065f46 !important;
      z-index: 38 !important;
    }
    #tableMDNU thead .sticky-col-pin {
      background-color: #e0e7ff !important;
      color: #3730a3 !important;
      z-index: 38 !important;
    }

    .sticky-col-nama {
      position: sticky !important;
      left: var(--col-pin-w) !important;
      z-index: 24 !important;
      width: var(--col-nama-w) !important;
      min-width: var(--col-nama-w) !important;
      max-width: var(--col-nama-w) !important;

      text-overflow: ellipsis !important;
      white-space: nowrap !important;
      background-color: #ffffff !important;

    tbody tr:nth-child(even) .sticky-col-nama {

    }

      background-color: #ffffff !important;

      top: 0;

    /* BADGES IDENTIK WEB UTAMA */
    .badge-cell {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: var(--cell-badge-w);

      height: var(--cell-badge-h);

  <!-- ================= LOGIKA JAVASCRIPT & ENGINE REKAP ================= -->
  <script>
    // State Portal Santri
    let db = null;
    let currentSantriTab = 'asrama';
    let holidaysData = {};
    let statusSantriAsrama = {};
    let statusSantriMDNU = {};
    let tglMulaiLajuSantri = {};
    let tanggalMulaiSantri = {};
    let asramaMatrixData = {};
    let mdnuMatrixData = {};
    let rawSantriList = [];

    // Kunci Cerdas Evaluasi Resmi Pesantren
    let manualCellOverrides = {};
    let permissionDetailsMap = {};
    let specialLiburAsrama = {};
    let settingMalamSabtuPerTanggal = {};

    let searchQuery = '';

    // ================= INITIALIZATION =================
    document.addEventListener('DOMContentLoaded', () => {
      loadOfflineFirstData();
      initFirebaseSantri();
      startLiveClock();

      // Cek parameter tab di URL (?tab=mdnu atau ?tab=asrama)
      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      if (tabParam === 'mdnu') {
        switchSantriTab('mdnu');
      } else {
        renderAsramaSpreadsheet();
      }
    });

    function loadOfflineFirstData() {
      try {
        const cachedSantri = localStorage.getItem('ppnu_cached_santriList');
        const cachedAsrama = localStorage.getItem('ppnu_cached_statusAsrama');
        const cachedMDNU = localStorage.getItem('ppnu_cached_statusMDNU');
        const cachedTglMulai = localStorage.getItem('ppnu_cached_tanggalMulaiSantri');
        if (cachedTglMulai) tanggalMulaiSantri = JSON.parse(cachedTglMulai);

        if (cachedSantri) {
          rawSantriList = JSON.parse(cachedSantri);
          statusSantriAsrama = cachedAsrama ? JSON.parse(cachedAsrama) : {};
          statusSantriMDNU = cachedMDNU ? JSON.parse(cachedMDNU) : {};
        } else if (window.PPNU_INITIAL_SEED) {
          rawSantriList = (window.PPNU_INITIAL_SEED.santriList || []).map(s => {
            const pin = String(s.pin || '').toUpperCase().trim();
            const kelas = s.kelas || (window.PPNUSantriStore ? window.PPNUSantriStore.extractClassFromPin(pin) : pin.substring(0, 3));
            return {
              pin,
              nama: s.nama || pin,
              name: s.nama || pin,
              kelas,
              status: 'mukim'
            };
          });
          statusSantriAsrama = window.PPNU_INITIAL_SEED.statusAsrama || {};
          statusSantriMDNU = window.PPNU_INITIAL_SEED.statusMDNU || {};
        }

        const cachedAsrMat = localStorage.getItem('ppnu_cached_asramaMatrix');
        const cachedMdnMat = localStorage.getItem('ppnu_cached_mdnuMatrix');
        if (cachedAsrMat) asramaMatrixData = JSON.parse(cachedAsrMat);
        if (cachedMdnMat) mdnuMatrixData = JSON.parse(cachedMdnMat);

        const cachedOvr = localStorage.getItem('ppnu_cached_manualCellOverrides');
        const cachedPerm = localStorage.getItem('ppnu_cached_permissionDetailsMap');
        const cachedSabtu = localStorage.getItem('ppnu_cached_settingMalamSabtu');
        const cachedLiburAsr = localStorage.getItem('ppnu_cached_specialLiburAsrama');
        if (cachedOvr) manualCellOverrides = JSON.parse(cachedOvr);
        if (cachedPerm) permissionDetailsMap = JSON.parse(cachedPerm);
        if (cachedSabtu) settingMalamSabtuPerTanggal = JSON.parse(cachedSabtu);
        if (cachedLiburAsr) specialLiburAsrama = JSON.parse(cachedLiburAsr);
      } catch (e) {
        console.warn('Gagal membaca cache santri:', e);
      }
    }

    function getSantriMasterList() {
      if (rawSantriList && rawSantriList.length > 0) return rawSantriList;
      if (window.PPNU_INITIAL_SEED && window.PPNU_INITIAL_SEED.santriList) {
        return window.PPNU_INITIAL_SEED.santriList.map(s => {
          const pin = String(s.pin || '').toUpperCase().trim();
          const kelas = s.kelas || (window.PPNUSantriStore ? window.PPNUSantriStore.extractClassFromPin(pin) : pin.substring(0, 3));
          return {
            pin,
            nama: s.nama || pin,
            name: s.nama || pin,
            kelas,
            status: 'mukim'
          };
        });
      }
      return [];
    }

    function startLiveClock() {
      const clockEl = document.getElementById('liveClockSantri');
      const update = () => {
        const d = (window.PPNURules && window.PPNURules.getWIBTime) ? new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Jakarta" })) : new Date();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const ss = String(d.getSeconds()).padStart(2, '0');
        if (clockEl) clockEl.textContent = `${hh}:${mm}:${ss} WIB`;
      };
      update();
      setInterval(update, 1000);
    }

    // ================= FIREBASE REALTIME LISTENER (READ-ONLY) =================
    function initFirebaseSantri() {
      try {
        if (!firebase.apps.length && window.PPNUConfig && window.PPNUConfig.firebaseConfig) {
          firebase.initializeApp(window.PPNUConfig.firebaseConfig);
        }
        if (!firebase.apps.length) return;

        db = firebase.database();
        const root = (window.PPNUConfig && window.PPNUConfig.ROOT_PATH) || 'absensi_ppnu';

        // Listen Holidays
        db.ref(`${root}/holidays`).on('value', snap => {
          holidaysData = snap.val() || {};
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });

        // Listen Status Santri
        db.ref(`${root}/statusSantriAsrama`).on('value', snap => {
          statusSantriAsrama = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_statusAsrama', JSON.stringify(statusSantriAsrama)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
        });
        db.ref(`${root}/statusSantriMDNU`).on('value', snap => {
          statusSantriMDNU = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_statusMDNU', JSON.stringify(statusSantriMDNU)); } catch (e) {}
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });
        db.ref(`${root}/tglMulaiLajuSantri`).on('value', snap => {
          tglMulaiLajuSantri = snap.val() || {};
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
        });
        db.ref(`${root}/tanggalMulaiSantri`).on('value', snap => {
          tanggalMulaiSantri = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_tanggalMulaiSantri', JSON.stringify(tanggalMulaiSantri)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });

        // Listen Matrix Asrama & MDNU
        db.ref(`${root}/asramaMatrix`).on('value', snap => {
          asramaMatrixData = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_asramaMatrix', JSON.stringify(asramaMatrixData)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
        });
        db.ref(`${root}/mdnuMatrix`).on('value', snap => {
          mdnuMatrixData = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_mdnuMatrix', JSON.stringify(mdnuMatrixData)); } catch (e) {}
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });

        // Listen Overrides & Permissions
        db.ref(`${root}/manualCellOverrides`).on('value', snap => {
          manualCellOverrides = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_manualCellOverrides', JSON.stringify(manualCellOverrides)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });
        db.ref(`${root}/permissionDetailsMap`).on('value', snap => {
          permissionDetailsMap = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_permissionDetailsMap', JSON.stringify(permissionDetailsMap)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });
        db.ref(`${root}/specialLiburAsrama`).on('value', snap => {
          specialLiburAsrama = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_specialLiburAsrama', JSON.stringify(specialLiburAsrama)); } catch (e) {}
          if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
        });
        db.ref(`${root}/settingMalamSabtuPerTanggal`).on('value', snap => {
          settingMalamSabtuPerTanggal = snap.val() || {};
          try { localStorage.setItem('ppnu_cached_settingMalamSabtu', JSON.stringify(settingMalamSabtuPerTanggal)); } catch (e) {}
          if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
        });

        // Listen Master Santri (dataSantriInduk / santriList)
        db.ref(`${root}/dataSantriInduk`).on('value', snap => {
          const val = snap.val();
          if (val) {
            const arr = Array.isArray(val) ? val : Object.values(val);
            rawSantriList = arr.filter(s => s.pin && s.pin !== '-').map(s => {
              const pin = String(s.pin || '').toUpperCase().trim();
              const kelas = s.kelas || (window.PPNUSantriStore ? window.PPNUSantriStore.extractClassFromPin(pin) : pin.substring(0, 3));
              return {
                pin,
                nama: s.nama || s.name || s.namaMesin || pin,
                name: s.nama || s.name || s.namaMesin || pin,
                kelas,
                kamar: s.kamar || '-',
                status: s.status || 'mukim'
              };
            });
            try { localStorage.setItem('ppnu_cached_santriList', JSON.stringify(rawSantriList)); } catch (e) {}
            if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
            if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
          }
        });

        db.ref(`${root}/santriList`).on('value', snap => {
          if (!rawSantriList || rawSantriList.length === 0) {
            if (snap.exists() && Array.isArray(snap.val())) {
              rawSantriList = snap.val().map(s => {
                const pin = String(s.pin || '').toUpperCase().trim();
                const kelas = s.kelas || (window.PPNUSantriStore ? window.PPNUSantriStore.extractClassFromPin(pin) : pin.substring(0, 3));
                return {
                  pin,
                  nama: s.nama || pin,
                  name: s.nama || pin,
                  kelas,
                  status: 'mukim'
                };
              });
              try { localStorage.setItem('ppnu_cached_santriList', JSON.stringify(rawSantriList)); } catch (e) {}
              if (currentSantriTab === 'asrama') renderAsramaSpreadsheet();
              if (currentSantriTab === 'mdnu') renderMDNUSpreadsheet();
            }
          }
        });
      } catch (err) {
        console.warn('Firebase init santri:', err);
      }
    }

    // ================= TAB SWITCHER =================

      const btnMdn = document.getElementById('tabBtnMDNU');

    // ================= TAB 1: SPREADSHEET ASRAMA RENDERER (AUTO-HIDE LIBUR) =================
    function renderAsramaSpreadsheet() {
      const table = document.getElementById('tableAsrama');
      if (!table) return;

      const monthVal = document.getElementById('selectMonthAsrama').value; // '2026-10'
      const filterStatus = document.getElementById('selectStatusAsrama').value;
      const hideEmptyLibur = true; // REVISI SENIOR: AUTO HIDE LIBUR SELALU TRUE
      // Filter santri
      let list = getSantriMasterList();
      if (filterStatus === 'mukim') {
        list = list.filter(s => {
          const st = (statusSantriAsrama && statusSantriAsrama[s.pin]) || s.status;
          return st !== 'laju' && st !== 'kantin' && st !== 'boyong';
        });
      } else {
        list = list.filter(s => {
          const st = (statusSantriAsrama && statusSantriAsrama[s.pin]) || s.status;
          return st !== 'boyong';
        });
      }

      if (searchQuery) {
        list = list.filter(s => {
          const matchName = (s.name || s.nama || '').toLowerCase().includes(searchQuery);
          const matchPin = (s.pin || '').toLowerCase().includes(searchQuery);
          return matchName || matchPin;
        });
      }

      const activePinsAsr = list.map(s => s.pin);

      let namaBulanLabel = '';
      const dateList = [];

      if (monthVal === 'all') {
        namaBulanLabel = 'KUMULATIF (JULI S.D OKTOBER 2026)';
        const monthRanges = [
          { year: 2026, month: 7, startDay: 14, endDay: 31 },
          { year: 2026, month: 8, startDay: 1, endDay: 31 },
          { year: 2026, month: 9, startDay: 1, endDay: 30 },
          { year: 2026, month: 10, startDay: 1, endDay: 31 },
        ];

        monthRanges.forEach(mr => {
          for (let day = mr.startDay; day <= mr.endDay; day++) {
            const dd = String(day).padStart(2, '0');
            const mm = String(mr.month).padStart(2, '0');
            const dateISO = `${mr.year}-${mm}-${dd}`;
            const dt = new Date(mr.year, mr.month - 1, day);
            const dayOfWeek = dt.getDay(); // 0 = Minggu, 5 = Jumat

            const isJumat = (dayOfWeek === 5);
            const isMinggu = (dayOfWeek === 0);
            const isHoliday = holidaysData && holidaysData[dateISO];

            let sessions = ['subuh', 'malam'];
            if (hideEmptyLibur) {
              sessions = sessions.filter(sessKey => {
                return activePinsAsr.some(pin => {
                  const cell = (window.PPNURules && window.PPNURules.getAsramaCell)
                    ? window.PPNURules.getAsramaCell({
                        pin,
                        dateISO,
                        dayOfWeek,
                        asramaMatrix: asramaMatrixData,
                        manualCellOverrides,
                        permissionDetailsMap,
                        specialLiburAsrama,
                        holidaysData,
                        statusSantriAsrama,
                        tglMulaiLajuSantri,
                        tanggalMulaiSantri,
                      })
                    : { subuh: '-', malam: '-' };
                  const v = cell[sessKey];
                  return v !== 'LIBUR' && v !== 'LAJU' && v !== 'BELUM';
                });
              });
            }

            if (sessions.length > 0) {
              dateList.push({
                day,
                month: mr.month,
                dateISO,
                dayOfWeek,
                dayName: ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'][dayOfWeek],
                isJumat,
                isMinggu,
                isHoliday: !!isHoliday,
                holidayDesc: isHoliday || '',
                sessions,
                displayLabel: `${day}/${mm}`
              });
            }
          }
        });
      } else {
        const [yearStr, monthStr] = monthVal.split('-');
        const year = parseInt(yearStr, 10);
        const month = parseInt(monthStr, 10);
        const totalDays = new Date(year, month, 0).getDate();
        namaBulanLabel = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][month - 1] + ' ' + year;

        const startDay = (monthVal === '2026-07') ? 14 : 1; // Asrama resmi mulai 14 Juli 2026
        for (let day = startDay; day <= totalDays; day++) {
          const dd = String(day).padStart(2, '0');
          const dateISO = `${yearStr}-${monthStr}-${dd}`;
          const dt = new Date(year, month - 1, day);
          const dayOfWeek = dt.getDay(); // 0 = Minggu, 5 = Jumat

          const isJumat = (dayOfWeek === 5);
          const isMinggu = (dayOfWeek === 0);
          const isHoliday = holidaysData && holidaysData[dateISO];

          let sessions = ['subuh', 'malam'];
          if (hideEmptyLibur) {
            sessions = sessions.filter(sessKey => {
              return activePinsAsr.some(pin => {
                const cell = (window.PPNURules && window.PPNURules.getAsramaCell)
                  ? window.PPNURules.getAsramaCell({
                      pin,
                      dateISO,
                      dayOfWeek,
                      asramaMatrix: asramaMatrixData,
                      manualCellOverrides,
                      permissionDetailsMap,
                      specialLiburAsrama,
                      holidaysData,
                      statusSantriAsrama,
                      tglMulaiLajuSantri,
                      tanggalMulaiSantri,
                    })
                  : { subuh: '-', malam: '-' };
                const v = cell[sessKey];
                return v !== 'LIBUR' && v !== 'LAJU' && v !== 'BELUM';
              });
            });
          }

          if (sessions.length > 0) {
            dateList.push({
              day,
              month,
              dateISO,
              dayOfWeek,
              dayName: ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'][dayOfWeek],
              isJumat,
              isMinggu,
              isHoliday: !!isHoliday,
              holidayDesc: isHoliday || '',
              sessions,
              displayLabel: `${day}`
            });
          }
        }
      }

      // Update Banner Asrama
      const bTitle = document.getElementById('bannerAsramaTitle');
      const bSub = document.getElementById('bannerAsramaSub');
      if (bTitle) bTitle.textContent = `REKAPITULASI ASRAMA PUTRA - ${namaBulanLabel.toUpperCase()}`;
      if (bSub) bSub.textContent = `${dateList.length} Tanggal Aktif (${dateList[0] ? dateList[0].dateISO : ''} s.d ${dateList[dateList.length - 1] ? dateList[dateList.length - 1].dateISO : ''})`;

      // BUILD TABLE HEADER
      let html = `<thead class="sticky-header">
        <tr>
          <th rowspan="2" class="col-pin sticky-col-pin font-black bg-emerald-100 text-emerald-950">PIN</th>
          <th rowspan="2" class="col-nama sticky-col-nama font-black border-r-thick bg-emerald-100 text-emerald-950">NAMA SANTRI</th>
          <th colspan="5" class="border-r-thick bg-emerald-200 text-emerald-950 font-black tracking-wider uppercase text-xs py-1.5">
            TOTAL REKAPITULASI
          </th>`;

      // Header Tanggal Asrama (Dynamic Colspan)
      dateList.forEach(d => {
        const bgHead = d.isHoliday ? 'bg-amber-200 text-amber-950' : (d.isJumat ? 'bg-amber-100 text-amber-950' : 'bg-emerald-100 text-emerald-950');
        const displayLabel = d.displayLabel || d.day;
        html += `<th colspan="${d.sessions.length}" class="${bgHead} border-r-thick py-1 px-1" title="${d.holidayDesc}">
          <span class="block text-xs font-black uppercase">${d.dayName}</span>
          <span class="block text-[10.5px] font-mono font-semibold">${displayLabel}</span>
        </th>`;
      });

      html += `</tr>
        <tr class="bg-emerald-50 text-[10.5px]">
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Hadir (H)">H</th>
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Alpha (A)">A</th>
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Izin (I)">I</th>
          <th class="col-stat bg-slate-100 text-slate-800 font-bold" title="Total Jam Pelajaran / Pertemuan">JP</th>
          <th class="col-pct border-r-thick bg-red-100 text-red-900 font-black" title="Persentase Alpha">%</th>`;

      dateList.forEach(d => {
        d.sessions.forEach((sess, sIdx) => {
          const isLast = (sIdx === d.sessions.length - 1);
          const borderThick = isLast ? 'border-r-thick' : '';
          const label = (sess === 'subuh') ? 'Subuh' : 'Malam';
          html += `<th class="col-sesi bg-emerald-50 text-emerald-950 ${borderThick}">${label}</th>`;
        });
      });

      html += `</tr>
      </thead>
      <tbody>`;

      // BUILD TABLE BODY ROWS
      list.forEach((santri, idx) => {
        let countH = 0, countI = 0, countA = 0, totalJP = 0;
        const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';

        const isLaju = (statusSantriAsrama[santri.pin] === 'laju' || statusSantriAsrama[santri.pin] === 'kantin');

        let sessionCells = '';
        dateList.forEach(d => {
          const cell = (window.PPNURules && window.PPNURules.getAsramaCell)
            ? window.PPNURules.getAsramaCell({
                pin: santri.pin,
                dateISO: d.dateISO,
                dayOfWeek: d.dayOfWeek,
                asramaMatrix: asramaMatrixData,
                manualCellOverrides,
                permissionDetailsMap,
                specialLiburAsrama,
                holidaysData,
                statusSantriAsrama,
                tglMulaiLajuSantri,
                tanggalMulaiSantri,
              })
            : { subuh: '-', malam: '-', subuh_time: '', malam_time: '', isLaju: false };

          d.sessions.forEach((sess, sIdx) => {
            const isLast = (sIdx === d.sessions.length - 1);
            const borderThick = isLast ? 'border-r-thick' : '';
            const val = cell[sess];
            const scanTime = cell[sess + '_time'];

            if (val !== '-' && val !== 'LIBUR' && val !== 'LAJU' && val !== 'BELUM' && val !== 'BELUM_MULAI') {
              totalJP++;
              if (val === 'H') countH++;
              else if (val === 'I') countI++;
              else if (val === 'A') countA++;
            }

            // READ-ONLY: Santri tidak bisa mengedit sel (tidak ada onclick modal)
            if (cell.isLaju) {
              sessionCells += `<td class="col-sesi ${borderThick} select-none">${renderBadge(val, 'asrama', true, scanTime)}</td>`;
            } else {
              sessionCells += `<td class="col-sesi ${borderThick} select-none">${renderBadge(val, 'asrama', false, scanTime)}</td>`;
            }
          });
        });

        // Persentase Alpha seperti web utama
        const persenAlpha = totalJP > 0 ? Math.round((countA / totalJP) * 100) : 0;
        const isOverLimit = (persenAlpha >= 15);
        const cellPercentClass = isOverLimit ? 'bg-red-600 text-white font-black' : 'bg-white text-slate-800 font-semibold';

        html += `<tr class="${rowBg} hover:bg-emerald-50/40 transition">
          <td class="col-pin sticky-col-pin font-mono font-bold text-slate-700">${santri.pin}</td>
          <td class="col-nama sticky-col-nama font-semibold text-slate-900 border-r-thick" title="${santri.name}">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="truncate">${santri.name}</span>
              ${isLaju ? '<span class="text-[9px] px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 font-extrabold border border-amber-300 shrink-0">LAJU</span>' : ''}
            </div>
          </td>
          <td class="col-stat font-mono font-bold text-emerald-900 bg-emerald-50/40">${countH}</td>
          <td class="col-stat font-mono font-bold text-rose-900 bg-rose-50/40">${countA}</td>
          <td class="col-stat font-mono font-bold text-amber-900 bg-amber-50/40">${countI}</td>
          <td class="col-stat font-mono font-bold text-slate-800 bg-slate-100">${totalJP}</td>
          <td class="col-pct font-mono border-r-thick ${cellPercentClass}">${persenAlpha}%</td>
          ${sessionCells}
        </tr>`;
      });

      html += `</tbody>`;
      table.innerHTML = html;
    }

                        tanggalMulaiSantri,
                      })
                    : { sore: '-', pel1: '-', pel2: '-', pel3: '-' };
                  const v = cell[sessKey];
                  return v !== 'LIBUR' && v !== 'LAJU' && v !== 'BELUM';
                });
              });
            }

            if (sessions.length > 0) {
              dateList.push({
                day,
                month: mr.month,
                dateISO,
                dayOfWeek,
                dayName: ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'][dayOfWeek],
                isJumat,
                isHoliday: !!isHoliday,
                holidayDesc: isHoliday || '',
                sessions,
                displayLabel: `${day}/${mm}`
              });
            }
          }
        });
      } else {
        const [yearStr, monthStr] = monthVal.split('-');
        const year = parseInt(yearStr, 10);
        const month = parseInt(monthStr, 10);
        const totalDays = new Date(year, month, 0).getDate();
        namaBulanLabel = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][month - 1] + ' ' + year;

        const startDay = (monthVal === '2026-07') ? 18 : 1; // MDNU resmi mulai 18 Juli 2026
        for (let day = startDay; day <= totalDays; day++) {
          const dd = String(day).padStart(2, '0');
          const dateISO = `${yearStr}-${monthStr}-${dd}`;
          const dt = new Date(year, month - 1, day);
          const dayOfWeek = dt.getDay(); // 0 = Minggu, 5 = Jumat

          const isJumat = (dayOfWeek === 5);
          const isHoliday = holidaysData && holidaysData[dateISO];

          let sessions = ['sore', 'pel1', 'pel2', 'pel3'];
          if (hideEmptyLibur) {
            sessions = sessions.filter(sessKey => {
              return activePinsMDN.some(pin => {
                const cell = (window.PPNURules && window.PPNURules.getMDNUCell)
                  ? window.PPNURules.getMDNUCell({
                      pin,
                      dateISO,
                      dayOfWeek,
                      mdnuMatrix: mdnuMatrixData,
                      manualCellOverrides,
                      permissionDetailsMap,
                      settingMalamSabtuPerTanggal,
                      holidaysData,
                      tanggalMulaiSantri,
                    })
                  : { sore: '-', pel1: '-', pel2: '-', pel3: '-' };
                const v = cell[sessKey];
                return v !== 'LIBUR' && v !== 'LAJU' && v !== 'BELUM';
              });
            });
          }

          if (sessions.length > 0) {
            dateList.push({
              day,
              month,
              dateISO,
              dayOfWeek,
              dayName: ['MIN', 'SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB'][dayOfWeek],
              isJumat,
              isHoliday: !!isHoliday,
              holidayDesc: isHoliday || '',
              sessions,
              displayLabel: `${day}`
            });
          }
        }
      }

      // Update Banner MDNU
      const bTitle = document.getElementById('bannerMDNUTitle');
      const bSub = document.getElementById('bannerMDNUSub');
      const kelasLabel = (filterKelas === 'all') ? 'SEMUA KELAS' : `KELAS ${filterKelas}`;
      if (bTitle) bTitle.textContent = `TABEL REKAPITULASI MDNU PUTRA - ${kelasLabel}`;
      if (bSub) bSub.textContent = `${dateList.length} Tanggal Aktif (${dateList[0] ? dateList[0].dateISO : ''} s.d ${dateList[dateList.length - 1] ? dateList[dateList.length - 1].dateISO : ''})`;

      // BUILD TABLE HEADER MDNU PERSIS WEB UTAMA
      let html = `<thead class="sticky-header">
        <tr>
          <th rowspan="2" class="col-pin sticky-col-pin font-black bg-indigo-100 text-indigo-950">PIN</th>
          <th rowspan="2" class="col-nama sticky-col-nama font-black border-r-thick bg-indigo-100 text-indigo-950">NAMA SANTRI</th>
          <th colspan="5" class="border-r-thick bg-indigo-200 text-indigo-950 font-black tracking-wider uppercase text-xs py-1.5">
            TOTAL REKAPITULASI
          </th>`;

      // Header Tanggal MDNU (Dynamic Colspan)
      dateList.forEach(d => {
        const bgHead = d.isHoliday ? 'bg-amber-200 text-amber-950' : (d.isJumat ? 'bg-amber-100 text-amber-950' : 'bg-indigo-100 text-indigo-950');
        const displayLabel = d.displayLabel || d.day;
        html += `<th colspan="${d.sessions.length}" class="${bgHead} border-r-thick py-1 px-1" title="${d.holidayDesc}">
          <span class="block text-xs font-black uppercase">${d.dayName}</span>
          <span class="block text-[10.5px] font-mono font-semibold">${displayLabel}</span>
        </th>`;
      });

      html += `</tr>
        <tr class="bg-indigo-50 text-[10.5px]">
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Hadir (H)">H</th>
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Alpha (A)">A</th>
          <th class="col-stat bg-[#cfe2f3] text-slate-800 font-bold" title="Izin (I)">I</th>
          <th class="col-stat bg-slate-100 text-slate-800 font-bold" title="Total Jam Pelajaran / Pertemuan">JP</th>
          <th class="col-pct border-r-thick bg-red-100 text-red-900 font-black" title="Persentase Alpha">%</th>`;

      dateList.forEach(d => {
        d.sessions.forEach((sess, sIdx) => {
          const isLast = (sIdx === d.sessions.length - 1);
          const borderThick = isLast ? 'border-r-thick' : '';
          let label = 'Sr';
          if (sess === 'pel1') label = 'P1';
          else if (sess === 'pel2') label = 'P2';
          else if (sess === 'pel3') label = 'P3';
          html += `<th class="col-sesi bg-indigo-50 text-indigo-950 ${borderThick}">${label}</th>`;
        });
      });

      html += `</tr>
      </thead>
      <tbody>`;

      // BUILD TABLE BODY ROWS
      list.forEach((santri, idx) => {
        let countH = 0, countI = 0, countA = 0, totalJP = 0;
        const rowBg = idx % 2 === 0 ? 'bg-white' : 'bg-slate-50';

        let sessionCells = '';
        dateList.forEach(d => {
          const cell = (window.PPNURules && window.PPNURules.getMDNUCell)
            ? window.PPNURules.getMDNUCell({
                pin: santri.pin,
                dateISO: d.dateISO,
                dayOfWeek: d.dayOfWeek,
                mdnuMatrix: mdnuMatrixData,
                manualCellOverrides,
                permissionDetailsMap,
                settingMalamSabtuPerTanggal,
                holidaysData,
                tanggalMulaiSantri,
              })
            : { sore: '-', pel1: '-', pel2: '-', pel3: '-', sore_time: '', pel1_time: '', pel2_time: '', pel3_time: '' };

          d.sessions.forEach((sess, sIdx) => {
            const isLast = (sIdx === d.sessions.length - 1);
            const borderThick = isLast ? 'border-r-thick' : '';
            const val = cell[sess] || '-';
            const scanTime = cell[sess + '_time'] || '';

            if (val !== '-' && val !== 'LIBUR' && val !== 'BELUM' && val !== 'BELUM_MULAI') {
              totalJP++;
              if (val === 'H') countH++;
              else if (val === 'I') countI++;
              else if (val === 'A') countA++;
            }

            // READ-ONLY: Santri tidak bisa mengedit sel (tidak ada onclick modal)
            sessionCells += `<td class="col-sesi ${borderThick} select-none">${renderBadge(val, 'mdnu', false, scanTime)}</td>`;
          });
        });

        const persenAlpha = totalJP > 0 ? Math.round((countA / totalJP) * 100) : 0;
        const isOverLimit = (persenAlpha >= 15);
        const cellPercentClass = isOverLimit ? 'bg-red-600 text-white font-black' : 'bg-white text-slate-800 font-semibold';

        html += `<tr class="${rowBg} hover:bg-indigo-50/40 transition">
          <td class="col-pin sticky-col-pin font-mono font-bold text-slate-700">${santri.pin}</td>
          <td class="col-nama sticky-col-nama font-semibold text-slate-900 border-r-thick truncate" title="${santri.name}">
            ${santri.name}
          </td>
          <td class="col-stat font-mono font-bold text-indigo-900 bg-indigo-50/40">${countH}</td>
          <td class="col-stat font-mono font-bold text-rose-900 bg-rose-50/40">${countA}</td>
          <td class="col-stat font-mono font-bold text-amber-900 bg-amber-50/40">${countI}</td>
          <td class="col-stat font-mono font-bold text-slate-800 bg-slate-100">${totalJP}</td>
          <td class="col-pct font-mono border-r-thick ${cellPercentClass}">${persenAlpha}%</td>
          ${sessionCells}
        </tr>`;
      });

      html += `</tbody>`;
      table.innerHTML = html;
    }

    // ================= BADGE HELPER IDENTIK WEB UTAMA (READ-ONLY) =================
    function renderBadge(val, category, isLajuBebas, time) {
      if (isLajuBebas && category === 'asrama') {
        return `<span class="badge-cell badge-libur" title="Santri Laju / Bebas Asrama">L</span>`;
      }

      if (val === 'BELUM' || val === 'BELUM_MULAI' || val === '-') {
        return `<span class="badge-cell text-slate-400 bg-slate-100 border border-slate-200 select-none cursor-default font-mono text-[11px]" title="Belum Mondok / Belum Wajib Absen">-</span>`;
      }

      if (val === 'H') {
        const displayHadir = (time && time.length >= 4) ? time.substring(0, 5) : 'H';
        const scanInfo = time ? `Scan: ${time} | ` : '';
        const monoClass = (time && time.length >= 4) ? 'font-mono' : '';
        return `<span class="badge-cell badge-hadir ${monoClass}" title="${scanInfo}Status: HADIR">${displayHadir}</span>`;
      } else if (val === 'A') {
        return `<span class="badge-cell badge-absen" title="Status: ALPHA">A</span>`;
      } else if (val === 'I') {
        return `<span class="badge-cell badge-izin" title="Status: IZIN">I</span>`;
      } else if (val === 'T') {
        const scanInfo = time ? `Scan: ${time} | ` : '';
        return `<span class="badge-cell badge-takzir font-mono" title="${scanInfo}Status: DITANGGUHKAN">T</span>`;
      } else if (val === 'LIBUR') {
        return `<span class="badge-cell badge-libur" title="Libur">L</span>`;
      }

      return `<span class="text-slate-300 font-mono text-[11px]">-</span>`;
    }

    function scrollTableTo(containerId, pos) {
      const el = document.getElementById(containerId);
      if (!el) return;
      if (pos === 'start') {
        el.scrollTo({ left: 0, behavior: 'smooth' });
      } else if (pos === 'end') {
        el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });
      } else if (pos === 'today') {
        const now = new Date();
        const day = now.getDate();
        const scrollRatio = day / 31;
        el.scrollTo({ left: el.scrollWidth * scrollRatio, behavior: 'smooth' });
      }
    }
  </script>
</body>
